  display: flex;
  justify-content: space-between;
  margin: 20px;
  flex-wrap: wrap;  /* Allows content to wrap on smaller screens */
}

.left-side {
  flex: 1 1;
  margin-right: 20px;
  min-width: 300px;  /* Ensures left side doesn't get too narrow on small screens */
}

.right-side {
  flex: 0.3 1;
  display: flex;
  flex-direction: column;
  justify-content: center;  /* Centers the content vertically */
  align-items: center;      /* Centers the content horizontally */
  text-align: center;       /* Centers the text */
  min-width: 250px;         /* Ensures right side doesn't get too narrow */
}

.goals {
  text-align: left;         /* Align text to the left for better readability */
  margin-bottom: 20px;
}

.goals h3 {
  font-size: 1.5rem;
  margin-bottom: 10px;
  color: #333;  /* Dark color for the heading */
}

.goals ul {
  list-style-type: disc;
  margin-left: 20px;
  color: #555;  /* Lighter color for the list items */
}

.image img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;  /* Optional: adds rounded corners to the image */
}

/* Form styling */
form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

input {
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 14px;
}

button {
  padding: 10px;
  background-color: #4CAF50;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background-color: #45a049;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
  .appointments-container {
    flex-direction: column;
    align-items: center;
  }

  .right-side {
    flex: 1 1;
    margin-top: 20px;
    text-align: left;  /* Adjust text alignment for better readability on mobile */
  }

  .left-side {
    margin-right: 0;
    margin-bottom: 20px;
    width: 100%;  /* Ensures the form takes up the full width on mobile */
  }
}
